[llm]
# === 这是首次运行自动生成的示例配置，请修改后重启 xAgent ===
# 任意 OpenAI 兼容服务：硅基流动 / OpenAI / DeepSeek / 本地 vLLM 等
base_url = https://api.example.com/v1
api_key = sk-请替换为你的API密钥
model = your-model-name
# 请求超时时间（秒）
timeout = 60

[agent]
# 留空则使用 core/config.py 中的默认系统提示词
system_prompt =
# 单轮对话最多允许的工具调用轮次
max_tool_rounds = 8
# 模型上下文窗口大小（tokens）；不确定就留空，将按 128000 并标注「默认」
context_window =
# 上下文用量告警阈值（达到该比例后暂停输入并提示 /compact）
context_warning_ratio = 0.7

[mcp]
# MCP 客户端连接超时（秒）
timeout = 30

[search]
# 联网搜索：百度千帆「智能搜索生成」API
# 留空 baidu_qianfan_api_key 则不启用 searchWeb 工具
base_url = https://qianfan.baidubce.com
baidu_qianfan_api_key =
model = ernie-4.5-turbo-128k
top_k = 8
timeout = 30
# 限定发布时间：day / week / month / semiyear / year，留空表示不限
recency =

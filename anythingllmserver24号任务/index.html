<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  .box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 12px; }
  .row { margin-bottom: 12px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
  input[type=file] { display: block; }
  button { padding: 8px 20px; font-size: 14px; cursor: pointer; }
  pre { background: #f6f8fa; border-radius: 6px; padding: 12px; overflow: auto; font-size: 12px; }
  .ok { color: #1a7f37; font-weight: 600; }
  .err { color: #cf222e; font-weight: 600; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <h1>AnythingLLM 文档上传</h1>
  <div class="box">
    <div class="row">
      <label>目标工作区</label>
      <div id="workspace"><span class="muted">正在获取…</span></div>
    </div>
    <div class="row">
      <label>选择文件（上传后自动解析并向量化嵌入）</label>
      <input type="file" id="fileInput">
    </div>
    <button id="uploadBtn" disabled>上传</button>
  </div>
  <div id="result" class="box" style="display:none"></div>

<script>
  const API = 'http://localhost:3001';
  const API_KEY = '7CSMYT4-VTM4R6J-NHPXRJR-ZTNZ2HD';

  const wsEl = document.getElementById('workspace');
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const resultEl = document.getElementById('result');

  let workspaceSlug = null;

  async function request(path, options = {}) {
    const res = await fetch(`${API}/api/v1${path}`, {
      ...options,
      headers: { 'Authorization': `Bearer ${API_KEY}`, ...(options.headers || {}) }
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) throw new Error(JSON.stringify(data) || `${res.status} ${res.statusText}`);
    return data;
  }

  async function loadWorkspace() {
    try {
      const list = await request('/workspaces');
      const first = list.workspaces[0];
      workspaceSlug = first.slug;
      wsEl.textContent = `${first.name}  (slug: ${workspaceSlug})`;
      uploadBtn.disabled = false;
    } catch (e) {
      wsEl.innerHTML = `<span class="err">获取工作区失败：${e.message}</span>`;
    }
  }

  function show(msg, isError) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<div class="${isError ? 'err' : 'ok'}">${msg}</div>`;
  }

  uploadBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) { show('请先选择文件', true); return; }
    const fd = new FormData();
    fd.append('file', file);
    fd.append('addToWorkspaces', workspaceSlug);
    uploadBtn.disabled = true;
    show('正在上传并向量化嵌入…');
    try {
      const data = await request('/document/upload', { method: 'POST', body: fd });
      const doc = data.documents && data.documents[0];
      resultEl.innerHTML = `<div class="ok">上传成功，向量化嵌入已入队处理</div><pre>${JSON.stringify(doc || data, null, 2)}</pre>`;
    } catch (e) {
      show(`上传失败：${e.message}`, true);
    } finally {
      uploadBtn.disabled = false;
    }
  });

  loadWorkspace();
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "Stateless MCP adapter for the Pet Hospital REST API"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]